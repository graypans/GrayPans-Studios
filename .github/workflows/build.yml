name: Build place file

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit toolchain
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Build place file
        run: rojo build default.project.json -o ProjectPorcelain.rbxlx

      - name: Upload place artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectPorcelain-place
          path: ProjectPorcelain.rbxlx
